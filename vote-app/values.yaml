vote:
  replicaCount: 1

  image:
    repository: 573539705056.dkr.ecr.eu-north-1.amazonaws.com/vote-app
    tag: "27e9894ed04931062e3403980a3db8eb5c617d82"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  probes:
    readiness:
      enabled: true
      path: /
      port: 80
      initialDelaySeconds: 5
      periodSeconds: 10

    liveness:
      enabled: true
      path: /
      port: 80
      initialDelaySeconds: 10
      periodSeconds: 20

    startup:
      enabled: true
      path: /
      port: 80
      failureThreshold: 30
      periodSeconds: 5

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379

worker:
  replicaCount: 1
  image:
    repository: kenny891/my-worker-app_demo
    tag: "1.0"
    pullPolicy: IfNotPresent

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  database:
    name: postgres
    username: postgres
    password: postgres

result:
  replicaCount: 1
  image:
    repository: kenny891/my-result-app_demo
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80