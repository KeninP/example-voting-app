apiVersion: apps/v1
kind: Deployment

metadata:
  name: vote-deployment

spec:
  replicas: {{ .Values.vote.replicaCount }}

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: vote

  template:
    metadata:
      labels:
        app: vote

    spec:
      containers:
        - name: vote
          image: "{{ .Values.vote.image.repository }}:{{ .Values.vote.image.tag }}"
          imagePullPolicy: {{ .Values.vote.image.pullPolicy }}

          ports:
            - containerPort: 80

          readinessProbe:
            {{- if .Values.vote.probes.readiness.enabled }}
            httpGet:
              path: {{ .Values.vote.probes.readiness.path }}
              port: {{ .Values.vote.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.vote.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.vote.probes.readiness.periodSeconds }}
            {{- end }}

          livenessProbe:
            {{- if .Values.vote.probes.liveness.enabled }}
            httpGet:
              path: {{ .Values.vote.probes.liveness.path }}
              port: {{ .Values.vote.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.vote.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.vote.probes.liveness.periodSeconds }}
            {{- end }}

          startupProbe:
            {{- if .Values.vote.probes.startup.enabled }}
            httpGet:
              path: {{ .Values.vote.probes.startup.path }}
              port: {{ .Values.vote.probes.startup.port }}
            failureThreshold: {{ .Values.vote.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.vote.probes.startup.periodSeconds }}
            {{- end }}