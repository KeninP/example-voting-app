name: Vote CI

on:
  push:
    branches:
      - main
    paths:
      - 'vote/**'
      - '.github/workflows/vote-ci.yml'

permissions:
  id-token: write
  contents: read

jobs:

  # Stage 1: Initial checks
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile vote/app.py


  # Stage 2: Application tests
  test:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vote/requirements.txt

      - name: Run tests
        run: |
          cd vote
          python -m pytest


  # Stage 3: Build Docker image
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t kenny891/my-vote-app_demo:6.0 ./vote

      - name: Save Docker image
        run: docker save kenny891/my-vote-app_demo:6.0 -o vote-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: vote-docker-image
          path: vote-image.tar


  # Stage 4: Push Docker image to Amazon ECR
  push:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: vote-docker-image

      - name: Load Docker image
        run: docker load -i vote-image.tar
      
      - name: Debug OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            
            console.log('OIDC claims:');
            console.log('sub:', payload.sub);
            console.log('aud:', payload.aud);
            console.log('repository:', payload.repository);
            console.log('repository_id:', payload.repository_id);
            console.log('repository_owner:', payload.repository_owner);
            console.log('repository_owner_id:', payload.repository_owner_id);
            console.log('ref:', payload.ref);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::573539705056:role/GitHubActions-ECR-EKS
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        run: |
          docker tag kenny891/my-vote-app_demo:6.0 573539705056.dkr.ecr.eu-north-1.amazonaws.com/vote-app:6.0
          docker push 573539705056.dkr.ecr.eu-north-1.amazonaws.com/vote-app:6.0