name: Vote CI

on:
  push:
    branches:
      - main
    paths:
      - 'vote/**'
      - '.github/workflows/vote-ci.yml'

jobs:

  # Stage 1: Initial checks
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile vote/app.py


  # Stage 2: Application tests
  test:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vote/requirements.txt

      - name: Run tests
        run: |
          cd vote
          python -m pytest


  # Stage 3: Build Docker image
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t kenny891/my-vote-app_demo:5.0 ./vote

      - name: Save Docker image
        run: docker save kenny891/my-vote-app_demo:5.0 -o vote-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: vote-docker-image
          path: vote-image.tar


  # Stage 4: Push Docker image
  push:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: vote-docker-image

      - name: Load Docker image
        run: docker load -i vote-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push kenny891/my-vote-app_demo:5.0