name: Vote CI

on:
  push:
    branches:
      - main
    paths:
      - 'vote/**'
      - '.github/workflows/vote-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-vote-app ./vote