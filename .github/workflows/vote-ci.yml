name: Vote CI

on:
  push:
    branches:
      - main
    paths:
      - 'vote/**'
      - '.github/workflows/vote-ci.yml'

jobs:

  # Stage 1: Initial checks
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile vote/app.py


  # Stage 2: Application tests
  test:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vote/requirements.txt

      - name: Run tests
        run: |
          cd vote
          python -m pytest


  # Stage 3: Docker image build
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-vote-app:5.0 ./vote


  # Stage 4: Push image to Docker Hub
  push:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-vote-app:5.0 ./vote

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        run: docker tag my-vote-app:5.0 kenny891/my-vote-app_demo:5.0

      - name: Push Docker image
        run: docker push kenny891/my-vote-app_demo:5.0