name: Result CI

on:
  push:
    branches:
      - main
    paths:
      - 'result/**'
      - '.github/workflows/result-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-result-app:1.0 ./result

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        run: docker tag my-result-app:1.0 kenny891/my-result-app_demo:1.0

      - name: Push Docker image
        run: docker push kenny891/my-result-app_demo:1.0